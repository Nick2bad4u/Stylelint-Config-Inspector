name: "CI"
concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true

run-name: "CI - Triggered by ${{ github.triggering_actor }}"

on:
    push:
        branches:
            - "main"

    pull_request:
        branches:
            - "main"

    workflow_dispatch:

permissions:
    contents: "read"

jobs:
    lint:
        runs-on: "ubuntu-latest"
        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # v6.0.3

            - name: "Set node"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Install pinned npm"
              run: |
                  npm_version=$(node -p "require('./package.json').packageManager.split('@').at(-1)")
                  npm install --global "npm@${npm_version}"
                  test "$(npm --version)" = "${npm_version}"

            - name: "Install"
              run: |
                  npm ci --ignore-scripts
                  npm run prepare

            - name: "Lint"
              run: "npm run lint"

            - name: "Typecheck"
              run: "npm run typecheck"

    node20-consumer:
        name: "Node 20 package consumer"
        runs-on: "ubuntu-latest"
        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # v6.0.3

            - name: "Set build Node.js"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Install pinned npm"
              run: |
                  npm_version=$(node -p "require('./package.json').packageManager.split('@').at(-1)")
                  npm install --global "npm@${npm_version}"
                  test "$(npm --version)" = "${npm_version}"

            - name: "Build package tarball"
              run: |
                  npm ci --ignore-scripts
                  npm run prepare
                  npm run build
                  echo "PACKAGE_TARBALL=$(npm pack --ignore-scripts --silent)" >> "$GITHUB_ENV"

            - name: "Set consumer Node.js"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version: "20.20.2"

            - name: "Verify packed CLI on Node 20"
              run: |
                  mkdir consumer
                  cd consumer
                  npm init --yes
                  npm install --ignore-scripts "../${PACKAGE_TARBALL}"
                  node node_modules/stylelint-config-inspector/bin.mjs --help
                  npm audit --omit=dev

    test:
        runs-on: "${{ matrix.os }}"
        permissions:
            contents: "read"
            id-token: "write"

        env:
            CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

        strategy:
            matrix:
                node: ["lts/*", 26, 24, 22]
                os: ["ubuntu-latest", "windows-latest", "macos-latest"]
            fail-fast: false

        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # v6.0.3

            - name: "Set node ${{ matrix.node }}"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version: "${{ matrix.node }}"
                  cache: "npm"

            - name: "Install pinned npm"
              run: |
                  npm_version=$(node -p "require('./package.json').packageManager.split('@').at(-1)")
                  npm install --global "npm@${npm_version}"
                  test "$(npm --version)" = "${npm_version}"

            - name: "Install"
              run: |
                  npm ci --ignore-scripts
                  npm run prepare

            - name: "Compute Codecov flags"
              id: "codecov_flags"
              run: |
                  if [[ "${{ matrix.os }}" == 'ubuntu-latest' ]]; then
                    codecov_os_flag='os-linux'
                  elif [[ "${{ matrix.os }}" == 'windows-latest' ]]; then
                    codecov_os_flag='os-windows'
                  else
                    codecov_os_flag='os-macos'
                  fi

                  if [[ "${{ matrix.node }}" == 'lts/*' ]]; then
                    codecov_node_flag='node-lts'
                  else
                    codecov_node_flag="node-${{ matrix.node }}"
                  fi

                  echo "os_flag=${codecov_os_flag}" >> "$GITHUB_OUTPUT"
                  echo "test_results_flag=${codecov_os_flag}-${codecov_node_flag}" >> "$GITHUB_OUTPUT"

            - name: "Build"
              run: "npm run build"

            - name: "Clean test report outputs"
              if: "${{ !cancelled() }}"
              run: "rm -rf coverage test-report.junit.xml"

            - name: "Test"
              if: "matrix.node != 'lts/*'"
              run: "npm run test -- --reporter=github-actions --reporter=dot --reporter=junit --outputFile=test-report.junit.xml --silent"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  TYPEFEST_VITEST_HANGING_PROCESS_REPORTER: "true"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Run tests with coverage and JUnit report"
              if: "matrix.node == 'lts/*'"
              run: "npm run test:coverage -- --coverage.reporter=lcovonly --reporter=github-actions --reporter=dot --reporter=junit --outputFile=test-report.junit.xml --silent"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  TYPEFEST_VITEST_HANGING_PROCESS_REPORTER: "true"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              if: "matrix.node == 'lts/*'"
              run: 'python -c "from datetime import datetime, timedelta, timezone; from pathlib import Path; artifact = Path(''coverage/lcov.info''); assert artifact.is_file(), ''coverage/lcov.info was not generated''; modified_at = datetime.fromtimestamp(artifact.stat().st_mtime, tz=timezone.utc); assert modified_at > datetime.now(timezone.utc) - timedelta(minutes=30), ''coverage/lcov.info is stale (older than 30 minutes)''; content = artifact.read_text(encoding=''utf-8''); assert len(content.strip()) > 0, ''coverage/lcov.info is empty''; assert ''SF:'' in content, ''coverage/lcov.info has no source file entries''"'

            - name: "Upload Nuxt bundle analysis to Codecov"
              if: "${{ matrix.node == 'lts/*' && matrix.os == 'ubuntu-latest' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}"
              continue-on-error: true
              run: "npm exec --yes --ignore-scripts --package=@codecov/bundle-analyzer@2.0.1 -- bundle-analyzer ./dist --bundle-name=nuxt"
              env:
                  GITHUB_SHA: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
                  GITHUB_REF: "${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}"

            - name: "Verify JUnit artifact"
              if: "${{ !cancelled() }}"
              run: 'python -c "from pathlib import Path; assert Path(''test-report.junit.xml'').is_file(), ''test-report.junit.xml was not generated''"'

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() }}"
              continue-on-error: true
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/stylelint-config-inspector"
                  files: "test-report.junit.xml"
                  flags: "${{ steps.codecov_flags.outputs.test_results_flag }}"
                  name: "vitest-junit-${{ steps.codecov_flags.outputs.test_results_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: false
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() && matrix.node == 'lts/*' }}"
              continue-on-error: true
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/stylelint-config-inspector"
                  files: "./coverage/lcov.info"
                  flags: "${{ steps.codecov_flags.outputs.os_flag }}"
                  name: "vitest-unit-coverage-${{ steps.codecov_flags.outputs.os_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: false
                  disable_search: true
                  verbose: true
